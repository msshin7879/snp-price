<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>헤지호그 단가조회</title>
<meta name="robots" content="noindex">
<style>
  /* 레이아웃: 상단 고정 검색 + 품목 카드 한 줄 목록 (위생 색상코드 도구 → 차가운 회청색 바탕, 품번은 파랑, 스페셜가는 초록) */
  :root {
    --bg: #f4ffe8;
    --hedgehog: #77bc2a;
    --card: #ffffff;
    --chip: #f2f5f8;
    --ink: #15202b;
    --muted: #5b6875;
    --line: #d9e0e7;
    --brand: #1d4ed8;
    --brand-soft: #e6edfd;
    --special: #0d7a52;
    --special-soft: #e3f4ec;
    --mark: #fde68a;
    --danger: #c0392b;
    --header: rgba(244, 255, 232, .94);
    --overlay: rgba(10, 16, 24, .78);
    --radius: 14px;
    --shadow: 0 1px 2px rgba(15, 30, 50, .06), 0 6px 18px rgba(15, 30, 50, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151b; --card: #18212a; --chip: #212c37; --ink: #e8eef4; --muted: #95a3b1;
      --line: #2b3743; --brand: #8fb1ff; --brand-soft: #1e2b47; --special: #5fd3a2;
      --special-soft: #163428; --mark: #6b5310; --danger: #ff8a7a; --header: rgba(15, 21, 27, .94);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f151b; --card: #18212a; --chip: #212c37; --ink: #e8eef4; --muted: #95a3b1;
    --line: #2b3743; --brand: #8fb1ff; --brand-soft: #1e2b47; --special: #5fd3a2;
    --special-soft: #163428; --mark: #6b5310; --danger: #ff8a7a; --header: rgba(15, 21, 27, .94);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--header);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
  h1 span { color: var(--hedgehog); }
  .basis { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .search { position: relative; margin-top: 10px; }
  .search input {
    width: 100%; font-size: 17px; padding: 13px 14px;
    border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
    outline: none; transition: border-color .15s;
  }
  .search input:focus { border-color: var(--brand); }
  button:focus-visible, .toggle input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .search button {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; font-size: 22px; color: var(--muted);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
  }
  .search button:hover { background: var(--line); }
  .controls { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; flex-wrap: wrap; }
  .field { display: grid; gap: 4px; flex: 1 1 180px; min-width: 0; }
  .field span { font-size: 12.5px; color: var(--muted); }
  .field select {
    font: inherit; font-size: 16px; font-weight: 700; padding: 11px 12px;
    border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
    outline: none; cursor: pointer;
  }
  .field select:focus { border-color: var(--brand); }
  .btns { display: flex; gap: 8px; flex: 0 0 auto; }
  .btns button {
    font: inherit; font-size: 16px; font-weight: 700; padding: 12px 20px; border-radius: 12px; cursor: pointer;
  }
  .btn-primary { border: 2px solid var(--brand); background: var(--brand); color: var(--card); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary { border: 2px solid var(--line); background: var(--card); color: var(--ink); }
  .btn-secondary:hover { border-color: var(--muted); }
  .btns button:active { transform: scale(.97); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 1.2em; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--brand); width: 16px; height: 16px; }

  main { padding: 12px 16px 40px; }
  .card {
    display: grid; grid-template-columns: 92px 1fr; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px; margin-bottom: 10px;
  }
  .photo {
    width: 92px; height: 92px; border-radius: 10px; background: #fff; border: 1px solid var(--line);
    object-fit: contain; cursor: zoom-in;
  }
  .photo.empty { display: grid; place-items: center; color: var(--line); font-size: 28px; cursor: default; }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .name { font-size: 16px; font-weight: 700; margin: 0; line-height: 1.3; word-break: keep-all; }
  .code {
    display: inline-block; margin-top: 4px; font: 600 13px ui-monospace, Consolas, monospace;
    color: var(--brand); background: var(--brand-soft); padding: 2px 7px; border-radius: 6px;
  }
  .copy {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }
  .copy:hover { border-color: var(--brand); color: var(--brand); }
  .copy:active { transform: scale(.96); }
  .copy.done { background: var(--special); border-color: var(--special); color: var(--card); }
  .specs { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; line-height: 1.5; }
  .specs b { color: var(--ink); font-weight: 600; }
  .note { font-size: 12.5px; color: var(--brand); margin-top: 2px; }
  .prices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 10px; max-width: 420px; }
  .prices.single { grid-template-columns: 1fr; max-width: 210px; }
  .price { border-radius: 10px; padding: 7px 9px; background: var(--chip); }
  .price dt { font-size: 11.5px; color: var(--muted); }
  .price dd { margin: 2px 0 0; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .price small { font-size: 10.5px; color: var(--muted); font-weight: 500; }
  .price.special { background: var(--special-soft); }
  .price.special dd { color: var(--special); }
  .price.dealer { background: var(--brand-soft); }
  .price.dealer dd { color: var(--brand); }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty-result { text-align: center; color: var(--muted); padding: 48px 0; font-size: 15px; }
  footer { text-align: center; color: var(--muted); font-size: 11.5px; padding: 0 16px 28px; }

  .zoom {
    position: fixed; inset: 0; z-index: 20; background: var(--overlay);
    display: none; place-items: center; padding: 24px; cursor: zoom-out;
  }
  .zoom.open { display: grid; }
  .zoom img { max-width: min(90vw, 420px); max-height: 80vh; background: #fff; border-radius: 14px; padding: 10px; }
  .zoom p { color: #fff; text-align: center; margin: 10px 0 0; font-size: 15px; }

  .lock {
    position: fixed; inset: 0; z-index: 30; background: var(--bg);
    display: grid; place-items: center; padding: 24px 16px;
  }
  .lock[hidden] { display: none; }
  .lock-card {
    width: min(100%, 360px); display: grid; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 24px 20px;
  }
  .lock-card h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
  .lock-card h2 span { color: var(--hedgehog); }
  .lock-card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .lock-card input[type=password] {
    font-size: 17px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--ink); outline: none;
  }
  .lock-card input[type=password]:focus { border-color: var(--brand); }
  .lock-card button {
    font-size: 16px; font-weight: 700; padding: 12px; border: 0; border-radius: 12px;
    background: var(--brand); color: var(--card); cursor: pointer;
  }
  .lock-card button:disabled { opacity: .6; cursor: progress; }
  .lock-msg { color: var(--danger); font-size: 14px; min-height: 1.2em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 420px) {
    .card { grid-template-columns: 72px 1fr; gap: 10px; padding: 10px; }
    .photo { width: 72px; height: 72px; }
    .price dd { font-size: 15px; }
    .price { padding: 6px 7px; }
    .price dt { white-space: nowrap; }
    .price small { display: block; }
    .btns { width: 100%; }
    .btns button { flex: 1; }
  }
</style>

<header>
  <div class="wrap">
    <div class="title-row">
      <h1><span>헤지호그</span> 단가조회</h1>
      <div class="basis" id="basis"></div>
    </div>
    <form id="searchForm" autocomplete="off">
      <div class="search">
        <label for="q" class="sr">품명 또는 품번</label>
        <input id="q" type="search" enterkeyhint="search" placeholder="품명 또는 품번 (예: 스퀴지, 10126)" autofocus>
      </div>
      <div class="controls">
        <label class="field" for="priceType">
          <span>단가유형</span>
          <select id="priceType">
            <option value="sale" selected>판매가</option>
            <option value="dealer">딜러가/판매가</option>
            <option value="special">스페셜가/판매가</option>
          </select>
        </label>
        <div class="btns">
          <button type="submit" class="btn-primary" id="searchBtn">조회</button>
          <button type="button" class="btn-secondary" id="resetBtn">초기화</button>
        </div>
      </div>
    </form>
    <div class="bar"><span id="summary"></span></div>
  </div>
</header>

<main class="wrap" id="list" aria-live="polite"></main>
<footer class="wrap" id="foot"></footer>

<div class="lock" id="lock" hidden>
  <form class="lock-card" id="lockForm" autocomplete="off">
    <h2><span>헤지호그</span> 단가조회</h2>
    <p>에스앤피 직원용입니다. 공유받은 비밀번호를 입력하세요.</p>
    <label for="pw" class="sr">비밀번호</label>
    <input id="pw" type="password" placeholder="비밀번호" required>
    <label class="toggle"><input id="remember" type="checkbox" checked> 이 기기에서 기억하기</label>
    <button id="unlock" type="submit">열기</button>
    <div class="lock-msg" id="lockMsg" role="alert"></div>
  </form>
</div>

<div class="zoom" id="zoom"><div><img id="zoomImg" alt=""><p id="zoomCap"></p></div></div>

<script>
let DATA = null;

const $ = (id) => document.getElementById(id);
const list = $("list"), q = $("q"), summary = $("summary");

const won = (n) => (n == null ? "-" : n.toLocaleString("ko-KR"));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s ?? "").toLowerCase().replace(/[\s\/\\\-_.,()\[\]×xø φ"”½]/g, "");

let items = [];

function highlight(text, query) {
  const t = String(text);
  if (!query) return esc(t);
  const at = t.toLowerCase().indexOf(query.toLowerCase());
  if (at < 0) return esc(t);
  return esc(t.slice(0, at)) + "<mark>" + esc(t.slice(at, at + query.length)) + "</mark>" + esc(t.slice(at + query.length));
}

function search(raw) {
  const query = raw.trim();
  if (!query) return items;
  const digits = query.replace(/\D/g, "");
  const isCode = /^\d+$/.test(query.replace(/\s/g, ""));
  const words = query.split(/\s+/).map(norm).filter(Boolean);
  return items
    .map((it) => {
      let rank = 99;
      if (isCode && digits) {
        if (it.digits === digits) rank = 0;
        else if (it.digits.startsWith(digits)) rank = 1;
        else if (it.digits.includes(digits)) rank = 2;
      }
      if (rank === 99 && words.every((w) => it.key.includes(w) || it.digits.includes(w))) {
        rank = it.key.startsWith(words[0]) ? 3 : 4;
      }
      return { it, rank };
    })
    .filter((r) => r.rank < 99)
    .sort((a, b) => a.rank - b.rank || a.it.code.localeCompare(b.it.code))
    .map((r) => r.it);
}

// 단가유형: 판매가 / 딜러가·판매가 / 스페셜가·판매가 (공급가는 VAT별도, 판매가는 VAT포함)
const SUPPLY = { dealer: "딜러가", special: "스페셜가" };
const priceType = () => $("priceType").value;

function priceBoxes(it) {
  const type = priceType();
  const sale = `<div class="price sale"><dt>판매가 <small>VAT포함</small></dt><dd>${won(it.sale)}</dd></div>`;
  if (!SUPPLY[type]) return `<dl class="prices single">${sale}</dl>`;
  const supply = `<div class="price ${type}"><dt>${SUPPLY[type]} <small>VAT별도</small></dt><dd>${won(it[type])}</dd></div>`;
  return `<dl class="prices">${supply}${sale}</dl>`;
}

function card(it, idx, query) {
  const photo = it.photo
    ? `<img class="photo" src="${it.photo}" alt="${esc(it.name)}" data-zoom="${idx}" loading="lazy">`
    : `<div class="photo empty">·</div>`;
  const isCodeQuery = /^\d+$/.test(query);
  return `
  <article class="card">
    ${photo}
    <div>
      <div class="top">
        <div>
          <h2 class="name">${highlight(it.name, isCodeQuery ? "" : query)}</h2>
          <span class="code">${highlight(it.code, isCodeQuery ? query : "")}</span>
        </div>
        <button class="copy" type="button" data-copy="${idx}">복사</button>
      </div>
      <p class="specs"><b>${esc(it.size || "-")}</b> mm · 입수 <b>${it.pack ?? "-"}</b>${it.color ? `<br>${esc(it.color)}` : ""}</p>
      ${it.note ? `<div class="note">※ ${esc(it.note)}</div>` : ""}
      ${priceBoxes(it)}
    </div>
  </article>`;
}

// 초기 상태는 빈 목록. [조회]를 눌러야 결과가 나온다
let shown = [];
let lastQuery = null;

function render() {
  if (lastQuery === null) {
    shown = [];
    list.innerHTML = "";
    summary.textContent = "";
    return;
  }
  shown = search(lastQuery);
  summary.textContent = `${shown.length}개 검색됨`;
  list.innerHTML = shown.length
    ? shown.map((it, i) => card(it, i, lastQuery)).join("")
    : `<div class="empty-result">‘${esc(lastQuery)}’ 결과가 없습니다.<br>품명 일부나 품번 숫자로 다시 찾아보세요.</div>`;
}

function runSearch() {
  const query = q.value.trim();
  if (!query) {
    lastQuery = null;
    render();
    summary.textContent = "품명 또는 품번을 입력하세요.";
    q.focus();
    return;
  }
  lastQuery = query;
  render();
  q.blur(); // 폰에서 키보드를 내려 결과가 보이게
}

function resetSearch() {
  q.value = "";
  $("priceType").value = "sale";
  lastQuery = null;
  render();
  q.focus();
}

// 복사 문구의 앞쪽 가격 이름: 딜러가는 '공급가', 스페셜가는 '스페셜가'
const COPY_LABEL = { dealer: "공급가", special: "스페셜가" };

function copyText(it) {
  const type = priceType();
  const head = `#${it.code} ${it.name}`;
  return SUPPLY[type]
    ? `${head}\n${won(it[type])} / ${won(it.sale)}\n${COPY_LABEL[type]}(부가세별도) / 판매가(부가세포함)입니다.`
    : `${head}\n${won(it.sale)}\n판매가(부가세포함)입니다.`;
}

async function copy(btn, text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
    if (!ok) { btn.textContent = "복사 안 됨"; setTimeout(() => { btn.textContent = "복사"; }, 1500); return; }
  }
  btn.textContent = "복사됨"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = "복사"; btn.classList.remove("done"); }, 1200);
}

list.addEventListener("click", (e) => {
  const c = e.target.closest("[data-copy]");
  if (c) return copy(c, copyText(shown[+c.dataset.copy]));
  const z = e.target.closest("[data-zoom]");
  if (z) {
    const it = shown[+z.dataset.zoom];
    $("zoomImg").src = it.photo; $("zoomCap").textContent = `${it.code} ${it.name}`;
    $("zoom").classList.add("open");
  }
});
$("zoom").addEventListener("click", () => $("zoom").classList.remove("open"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("zoom").classList.remove("open"); });

$("searchForm").addEventListener("submit", (e) => { e.preventDefault(); runSearch(); });
$("resetBtn").addEventListener("click", resetSearch);
$("priceType").addEventListener("change", render); // 이미 조회한 결과의 가격만 바꿔 보여준다

function boot(data) {
  DATA = data;
  items = DATA.items.map((it) => ({ ...it, key: norm(it.name), digits: String(it.code).replace(/\D/g, "") }));
  $("basis").textContent = DATA.meta.basis || "";
  $("foot").textContent = `원본 ${DATA.meta.source} · 빌드 ${DATA.meta.builtAt} · 판매가 VAT포함 / 딜러가·스페셜가 VAT별도`;
  $("lock").hidden = true;
  q.disabled = false;
  render();
  q.focus();
}

// ── 잠금: 직원 공유용 빌드는 데이터가 암호화돼 있다 (AES-GCM, 비밀번호→PBKDF2) ──
const KEY_STORE = "hh-key";
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function deriveKey(password, sealed) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: b64(sealed.salt), iterations: sealed.iter },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}

async function openWith(key, sealed) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(sealed.iv) }, key, b64(sealed.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function tryRemembered(sealed) {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch {}
  if (!saved) return false;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
    boot(await openWith(key, sealed));
    return true;
  } catch {
    try { localStorage.removeItem(KEY_STORE); } catch {} // 비밀번호가 바뀌었으면 다시 묻는다
    return false;
  }
}

function showLock(sealed) {
  q.disabled = true;
  $("lock").hidden = false;
  $("pw").focus();
  $("lockForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("unlock");
    btn.disabled = true; btn.textContent = "확인 중…"; $("lockMsg").textContent = "";
    try {
      const key = await deriveKey($("pw").value, sealed);
      const data = await openWith(key, sealed);
      if ($("remember").checked) {
        try { localStorage.setItem(KEY_STORE, toB64(await crypto.subtle.exportKey("raw", key))); } catch {}
      }
      boot(data);
    } catch {
      $("lockMsg").textContent = "비밀번호가 맞지 않습니다. 다시 입력하세요.";
      $("pw").select();
    } finally {
      btn.disabled = false; btn.textContent = "열기";
    }
  });
